[project]
name = "orderguard"
version = "1.0.0"
description = "Pre-trade guard for AI trading agents: agents may believe fake information; OrderGuard decides what they may do using numbers they can't touch, and checks the facts their orders rely on."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.9,<2",
    "pydantic>=2.7,<3",
    "httpx>=0.27",
    "cryptography>=42",
    "numpy>=1.26,<3",  # market generation and the envelope lab in the base app
]

[project.optional-dependencies]
dev = ["pytest>=8"]
detector = ["transformers>=4.40", "torch>=2.2"]
ml = ["scikit-learn>=1.4"]          # training the detector models only; inference needs no extra
app = []                             # the web app ships in the base install; kept so `pip install .[app]` is valid

[project.scripts]
og = "orderguard_verify.cli:main"
orderguard = "orderguard_guard.cli:main"
og-lab = "orderguard_lab.cli:main"
orderguard-mcp = "orderguard_mcp.server:main"
og-arena = "orderguard_arena.cli:main"
og-risk = "orderguard_risk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/orderguard_verify", "python/orderguard_guard", "python/orderguard_lab", "python/orderguard_app", "python/orderguard_mcp", "python/orderguard_arena", "python/orderguard_risk"]

[tool.hatch.build.targets.wheel.force-include]
"policies" = "orderguard_guard/policies"     # the policy-pack templates; `orderguard policy` reads them from the installed package

[tool.pytest.ini_options]
testpaths = ["python/tests"]
