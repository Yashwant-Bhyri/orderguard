# Set up the signed public policy in ./var/paper-policy first. See docs/OPERATIONS.md.
#
# The bridge listens on 127.0.0.1 inside its container and rejects any other Host header, by design. The app therefore shares
# the receiver's network namespace (network_mode: service:receiver) and reaches it at http://127.0.0.1:8700. The only published
# port is the app's, bound to the host's loopback.
x-paper-policy: &paper-policy
  type: bind
  source: ./var/paper-policy
  target: /app/paper-policy
  read_only: true
  bind:
    create_host_path: false

services:
  receiver:
    build: .
    image: orderguard:local
    command: ["orderguard", "paper-receiver", "--dir", "/app/paper-policy", "--ledger", "/app/ledger/paper-ledger.sqlite"]
    init: true
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:8600:8600"      # published here because the app joins this network namespace
    volumes:
      - *paper-policy
      - ledger:/app/ledger          # persistent, hash-chain-verified at every start; see docs/OPERATIONS.md (ledger)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8700/health').then(r=>r.ok?r.json():{}).then(h=>process.exit(h.issuerMandateActive&&!h.revoked?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    image: orderguard:local
    network_mode: "service:receiver"
    depends_on:
      receiver:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ORDERGUARD_HOME: /app/paper-policy
      ORDERGUARD_RECEIVER_URL: http://127.0.0.1:8700
      OG_RECORD_DIR: /app/var/replay
    volumes:
      - *paper-policy
      - app-data:/app/var
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  app-data:
  ledger:
